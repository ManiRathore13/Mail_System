<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>odNest Mail - Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="description" content="odNest Mail Dashboard" />
  </head>
  <body class="dashboard-body">
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
      <div class="nav-left">
        <div class="logo-container sm">
          <img src="logo.png" alt="OdNest Logo" class="logo-image" />
        </div>
        <div class="brand-text">
          <span class="brand-name">odNest</span>
          <span class="brand-sub">MAIL</span>
        </div>
        
        <ul class="nav-links">
          <li><a href="#" class="active">Overview</a></li>
          <li><a href="#">Leads</a></li>
          <li><a href="#">Template</a></li>
          <li><a href="#">Smtp</a></li>
          <li><a href="#">Logs</a></li>
          <li><a href="#">Spam Test</a></li>
        </ul>
      </div>

      <div class="nav-right">
        <button class="icon-btn" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
        <div class="divider"></div>
        <div class="campaign-selector">
          <select>
            <option>All Campaigns</option>
          </select>
        </div>
        <button class="icon-btn border">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </button>
        <button class="btn btn-primary btn-launch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
          <span>Launch Campaign</span>
        </button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main class="dashboard-content">
      <!-- KPI Cards -->
      <section class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon-wrapper kpi-purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </div>
          <div class="kpi-info">
            <h3>Total Leads</h3>
            <p class="kpi-value">0</p>
            <p class="kpi-sub">Verified emails</p>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon-wrapper kpi-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </div>
          <div class="kpi-info">
            <h3>Sent Today</h3>
            <p class="kpi-value">0</p>
            <p class="kpi-sub">24h volume</p>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon-wrapper kpi-green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          </div>
          <div class="kpi-info">
            <h3>Open Rate</h3>
            <p class="kpi-value">0%</p>
            <p class="kpi-sub">Real-time engagement</p>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon-wrapper kpi-pink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="20" x2="18" y2="10" />
              <line x1="12" y1="20" x2="12" y2="4" />
              <line x1="6" y1="20" x2="6" y2="14" />
            </svg>
          </div>
          <div class="kpi-info">
            <h3>Click Rate</h3>
            <p class="kpi-value">0%</p>
            <p class="kpi-sub">Link interactions</p>
          </div>
        </div>
      </section>

      <!-- Charts Area -->
      <section class="charts-grid">
        <div class="panel chart-panel">
          <div class="panel-header">
            <h2>Delivery Trends</h2>
            <button class="icon-btn small">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10" />
                <polyline points="23 20 23 14 17 14" />
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
              </svg>
            </button>
          </div>
          <div class="chart-container">
            <canvas id="deliveryChart"></canvas>
          </div>
        </div>

        <div class="panel stats-panel">
          <div class="panel-header">
            <h2>Quick Stats</h2>
            <button class="icon-btn small">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="1 4 1 10 7 10" />
                <polyline points="23 20 23 14 17 14" />
                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
              </svg>
            </button>
          </div>
          <div class="panel-body empty-state">
            <p>No SMTP accounts configured.</p>
          </div>
        </div>
      </section>
    </main>
    <script src="dashboard.js"></script>
  </body>
</html>
