<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>odNest Mail - Sign Up</title>
    <link rel="stylesheet" href="style.css" />
    <meta name="description" content="Start your odNest marketing journey today" />
  </head>
  <body>
    <div class="auth-container">
      <div class="card auth-card">
        <div class="card-header">
          <div class="logo-container">
            <img src="logo.png" alt="OdNest Logo" class="logo-image" />
          </div>
          <h1>Create Account</h1>
          <p class="subtitle">Start your email marketing journey today.</p>
        </div>
        
        <form id="signup-form" class="auth-form">
          <div class="input-group">
            <label for="name">Full Name</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input type="text" id="name" name="name" placeholder="Enter your name" required />
            </div>
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <path d="M16 2v4" />
                <path d="M8 2v4" />
                <path d="M3 10h18" />
              </svg>
              <input type="email" id="email" name="email" placeholder="name@odnest.com" required />
            </div>
          </div>
          
          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" id="password" name="password" placeholder="••••••••" required />
            </div>
          </div>
          
          <div id="error-message" class="error-message hidden">
            <!-- Dynamic Error Content -->
          </div>
          
          <button type="submit" class="btn btn-primary btn-block">
            <span>Create Account</span>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12" />
              <polyline points="12 5 19 12 12 19" />
            </svg>
          </button>
        </form>
        
        <div class="card-footer">
          <p>Already have an account? <a href="index.html" class="link">Log in</a></p>
        </div>
      </div>
      <div class="page-footer">
        <p>&copy; 2026 odNest Mail. All rights reserved.</p>
      </div>
    </div>
    
    <script src="main.js"></script>
    <style>
      .animate-spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
